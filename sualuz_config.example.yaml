# Configurações da API SuaLuz
sualuz:
  # Contrato usado pelo cliente web atual da SuaLuz.
  api_mode: "wisebyte"
  base_url: "https://apiapp.sualuz.com.br/wisebyte-site/prod/api/v0.1.0/item-pt"

  # Identificador do medidor. O prefixo "luz-" é removido somente na chamada
  # Wisebyte, mas preservado como tag no InfluxDB.
  mac: "luz-xxxxxx"

  # Token Bearer da sessão web. Ele expira e deve permanecer fora do Git.
  bearer_token: "COLE_O_SEU_TOKEN_BEARER_VALIDO_AQUI"

  timeout_seconds: 60
  request_interval_seconds: 1.5

# Configurações do InfluxDB (não são necessárias com --dry-run)
influxdb:
  url: "http://SEU_IP_OU_HOSTNAME_INFLUXDB:8086"
  token: "SEU_TOKEN_API_DO_INFLUXDB"
  org: "sua_organizacao_influx"
  bucket: "sualuz"

timezone: "America/Sao_Paulo"
